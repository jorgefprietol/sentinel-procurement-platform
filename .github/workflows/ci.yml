name: DevSecOps
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions: { contents: read, actions: read, security-events: write }
  verify:
    name: Build, security and browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Validate specification and dependencies
        run: |
          npm ci
          npm run check:contract
          npm run format:check
          npm audit --audit-level=high
          npm ci --prefix apps/web
          npm audit --prefix apps/web --audit-level=high
          npm run build --prefix apps/web
      - name: Check repository for secrets
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0 fs --offline-scan --scanners secret --exit-code 1 /src
      - name: Generate ephemeral runtime secrets
        run: node scripts/bootstrap.mjs
      - name: Build and start isolated stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Security contract and concurrency scenarios
        run: npm run test:security
      - name: Browser acceptance
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Image findings, policy and SBOM
        run: |
          mkdir -p artifacts
          docker volume create sentinel-trivy-cache
          for image in dotnet java partner web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v sentinel-trivy-cache:/root/.cache/trivy -v "$PWD/artifacts:/reports" aquasec/trivy:0.75.0 image --offline-scan --scanners vuln --format json --output "/reports/$image-vulnerabilities.json" "sentinel-$image:local"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v sentinel-trivy-cache:/root/.cache/trivy -v "$PWD/artifacts:/reports" aquasec/trivy:0.75.0 image --offline-scan --format cyclonedx --output "/reports/$image-sbom.json" "sentinel-$image:local"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v sentinel-trivy-cache:/root/.cache/trivy aquasec/trivy:0.75.0 image --offline-scan --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "sentinel-$image:local"
          done
      - name: Collect safe diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f .env ]; then
            docker compose logs --no-color --tail=100 > artifacts/runtime.log
            docker compose down -v
          else
            echo 'Runtime did not start.' > artifacts/runtime.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          { name: verification-evidence, path: artifacts/, retention-days: 14 }
  publish:
    name: Publish ${{ matrix.component }}
    needs: [verify, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: dotnet, dockerfile: services/dotnet/Dockerfile }
          - { component: java, dockerfile: services/java/Dockerfile }
          - { component: partner, dockerfile: services/partner/Dockerfile }
          - { component: web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
