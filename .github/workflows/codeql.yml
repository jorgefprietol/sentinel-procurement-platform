name: CodeQL
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule: [{ cron: "23 9 * * 1" }]
permissions: { contents: read, actions: read, security-events: write }
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: csharp, build-mode: manual }
          - { language: java-kotlin, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.language == 'csharp'
        with: { dotnet-version: "10.0.x" }
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build C#
        if: matrix.language == 'csharp'
        run: dotnet build services/dotnet/Sentinel.Api.csproj -c Release
      - name: Build Java
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f services/java/pom.xml verify
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with: { category: "sentinel-api-security-${{ matrix.language }}" }
