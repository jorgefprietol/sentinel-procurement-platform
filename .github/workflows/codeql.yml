name: CodeQL
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule: [{ cron: "23 9 * * 1" }]
permissions: { contents: read, actions: read, security-events: write }
jobs:
  analyze:
    name: Analyze C#, Java and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "10.0.x" }
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          {
            languages: "csharp,java-kotlin,javascript-typescript",
            build-mode: manual,
            queries: security-extended,
          }
      - name: Build compiled languages
        run: |
          dotnet build services/dotnet/Sentinel.Api.csproj -c Release
          mvn -B -f services/java/pom.xml verify
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with: { category: sentinel-api-security }
